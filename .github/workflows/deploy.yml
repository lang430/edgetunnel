name: Deploy to Cloudflare

on:
  schedule:
    - cron: "10 0 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy-account1:
    name: Delete and deploy account1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_1 }}
      WORKER_ENV: account1
      CUSTOM_DOMAIN: ${{ secrets.CF_CUSTOM_DOMAIN_1 }}
      ADMIN_SECRET: ${{ secrets.ADMIN_1 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete and deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${ADMIN_SECRET}"

          cleanup() { rm -f .wrangler-secrets.env; }
          trap cleanup EXIT

          echo ">>> [${WORKER_ENV}] Deleting old worker..."
          npx --yes wrangler@4.81.1 delete --env "${WORKER_ENV}" --force 2>&1 || echo ">>> [${WORKER_ENV}] No existing worker to delete or delete failed, continuing..."

          umask 077
          printf 'ADMIN=%s\n' "${ADMIN_SECRET}" > .wrangler-secrets.env

          deploy_args=(deploy --env "${WORKER_ENV}" --secrets-file .wrangler-secrets.env)
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo ">>> [${WORKER_ENV}] Using custom domain: ${CUSTOM_DOMAIN}"
            deploy_args+=(--domain "${CUSTOM_DOMAIN}")
          fi

          echo ">>> [${WORKER_ENV}] Deploying worker..."
          npx --yes wrangler@4.81.1 "${deploy_args[@]}" 2>&1
          echo ">>> [${WORKER_ENV}] Deployment completed."

  deploy-account2:
    name: Delete and deploy account2
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_2 }}
      WORKER_ENV: account2
      CUSTOM_DOMAIN: ${{ secrets.CF_CUSTOM_DOMAIN_2 }}
      ADMIN_SECRET: ${{ secrets.ADMIN_2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete and deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${ADMIN_SECRET}"

          cleanup() { rm -f .wrangler-secrets.env; }
          trap cleanup EXIT

          echo ">>> [${WORKER_ENV}] Deleting old worker..."
          npx --yes wrangler@4.81.1 delete --env "${WORKER_ENV}" --force 2>&1 || echo ">>> [${WORKER_ENV}] No existing worker to delete or delete failed, continuing..."

          umask 077
          printf 'ADMIN=%s\n' "${ADMIN_SECRET}" > .wrangler-secrets.env

          deploy_args=(deploy --env "${WORKER_ENV}" --secrets-file .wrangler-secrets.env)
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo ">>> [${WORKER_ENV}] Using custom domain: ${CUSTOM_DOMAIN}"
            deploy_args+=(--domain "${CUSTOM_DOMAIN}")
          fi

          echo ">>> [${WORKER_ENV}] Deploying worker..."
          npx --yes wrangler@4.81.1 "${deploy_args[@]}" 2>&1
          echo ">>> [${WORKER_ENV}] Deployment completed."